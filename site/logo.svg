<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#33206e"/>
      <stop offset="0.55" stop-color="#160f3a"/>
      <stop offset="1" stop-color="#0a0820"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe7a8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffe7a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#b48cff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6f4cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a80"/>
      <stop offset="1" stop-color="#1a1145"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <g fill="#fff3cf">
      <circle cx="200" cy="220" r="5"/><circle cx="830" cy="190" r="6"/><circle cx="870" cy="380" r="4"/>
      <circle cx="160" cy="430" r="4"/><circle cx="300" cy="150" r="3"/><circle cx="760" cy="300" r="3"/>
      <circle cx="250" cy="330" r="3"/><circle cx="880" cy="520" r="3"/>
    </g>
    <g stroke="#cdb8ff" stroke-opacity="0.5" stroke-width="3" fill="none">
      <polyline points="760,300 830,190 870,380"/><polyline points="160,430 250,330 200,220 300,150"/>
    </g>
    <path d="M830 160 l9 21 21 9 -21 9 -9 21 -9 -21 -21 -9 21 -9z" fill="#ffd98a"/>
    <!-- starlight beam from the summit -->
    <path d="M492 100 L532 100 L560 560 L464 560 Z" fill="url(#beam)" opacity="0.55"/>
    <circle cx="512" cy="470" r="360" fill="url(#halo)"/>
    <!-- Mount Targon -->
    <path d="M100 924 L100 760 L250 640 L340 700 L512 470 L690 700 L780 630 L924 760 L924 924 Z" fill="url(#peak)"/>
    <path d="M512 470 L560 535 L534 530 L512 562 L490 532 L462 538 Z" fill="#fff1c9" fill-opacity="0.8"/>
    <path d="M100 924 L100 840 L240 760 L360 820 L512 730 L660 820 L790 760 L924 840 L924 924 Z" fill="#120b33"/>
    <g transform="translate(292 300) scale(2.2)">
  
  <defs>
    <linearGradient id="mb" x1="0" y1="10" x2="0" y2="255" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="0.55" stop-color="#ffd21f"/>
      <stop offset="1" stop-color="#f2ad12"/>
    </linearGradient>
    <radialGradient id="mshine" cx="0.36" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#fff6b8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff6b8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- torso and two short legs -->
  <path d="M86 140 C82 166 58 196 58 224 C58 244 68 254 80 254 C90 254 94 246 95 236 Q100 226 105 236 C106 246 110 254 120 254 C132 254 142 244 142 224 C142 196 118 166 114 140 Z" fill="url(#mb)" stroke="#b8571c" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- round head -->
  <circle cx="100" cy="80" r="66" fill="url(#mb)" stroke="#b8571c" stroke-width="2.5"/>
  <circle cx="100" cy="80" r="66" fill="url(#mshine)"/>
  <!-- markings: swirls above the eyes, lines down the cheeks -->
  <g fill="none" stroke="#c8611d" stroke-width="2.6" stroke-linecap="round">
    <path d="M74 63 C72 46 58 38 50 46 C44 53 50 62 58 58 C62 56 61 50 57 50"/>
    <path d="M126 63 C128 46 142 38 150 46 C156 53 150 62 142 58 C138 56 139 50 143 50"/>
    <path d="M48 98 C46 114 54 126 70 132"/>
    <path d="M152 98 C154 114 146 126 130 132"/>
  </g>
  <!-- big white eyes, no pupils -->
  <ellipse cx="68" cy="92" rx="22" ry="28" transform="rotate(-12 68 92)" fill="#fffdf2" stroke="#c8611d" stroke-width="3"/>
  <ellipse cx="132" cy="92" rx="22" ry="28" transform="rotate(12 132 92)" fill="#fffdf2" stroke="#c8611d" stroke-width="3"/>
</g>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
</svg>
