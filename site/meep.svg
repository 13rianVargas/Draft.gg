<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <style>
    .arm { opacity: 0; transform-box: fill-box; transform-origin: center; animation: peek 8s ease-in-out infinite; }
    .arm.r { animation-delay: -4.5s; }
    @keyframes peek { 0%, 62%, 100% { opacity: 0; transform: scale(.2); } 70%, 88% { opacity: 1; transform: scale(1); } }
  </style>
  <defs>
    <linearGradient id="mb" x1="0" y1="10" x2="0" y2="255" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="0.55" stop-color="#ffd21f"/>
      <stop offset="1" stop-color="#f2ad12"/>
    </linearGradient>
    <radialGradient id="mshine" cx="0.36" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#fff6b8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff6b8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- arms: they show up now and then, then hide again -->
  <ellipse class="arm" cx="46" cy="188" rx="11" ry="15" transform="rotate(-20 46 188)" fill="url(#mb)" stroke="#b8571c" stroke-width="2.5"/>
  <ellipse class="arm r" cx="154" cy="192" rx="10" ry="13" transform="rotate(20 154 192)" fill="url(#mb)" stroke="#b8571c" stroke-width="2.5"/>
  <!-- torso and two short legs -->
  <path d="M86 140 C82 166 58 196 58 224 C58 244 68 254 80 254 C90 254 94 246 95 236 Q100 226 105 236 C106 246 110 254 120 254 C132 254 142 244 142 224 C142 196 118 166 114 140 Z" fill="url(#mb)" stroke="#b8571c" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- round head -->
  <circle cx="100" cy="80" r="66" fill="url(#mb)" stroke="#b8571c" stroke-width="2.5"/>
  <circle cx="100" cy="80" r="66" fill="url(#mshine)"/>
  <!-- markings: swirls above the eyes, lines down the cheeks -->
  <g fill="none" stroke="#c8611d" stroke-width="2.6" stroke-linecap="round">
    <path d="M74 63 C72 46 58 38 50 46 C44 53 50 62 58 58 C62 56 61 50 57 50"/>
    <path d="M126 63 C128 46 142 38 150 46 C156 53 150 62 142 58 C138 56 139 50 143 50"/>
    <path d="M48 98 C46 114 54 126 70 132"/>
    <path d="M152 98 C154 114 146 126 130 132"/>
  </g>
  <!-- big white eyes, no pupils -->
  <ellipse cx="68" cy="92" rx="22" ry="28" transform="rotate(-12 68 92)" fill="#fffdf2" stroke="#c8611d" stroke-width="3"/>
  <ellipse cx="132" cy="92" rx="22" ry="28" transform="rotate(12 132 92)" fill="#fffdf2" stroke="#c8611d" stroke-width="3"/>
</svg>
